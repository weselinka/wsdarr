# wsdarr (Webshare downloadarr) + Sonarr + Radarr – example stack.
# All containers that touch downloads must see the same path (/data here) so Sonarr/Radarr
# can import what wsdarr downloads (hardlinks work when media lives on the same volume).
#
# After the first start get the wsdarr API key with:  docker exec wsdarr wsdarr apikey
# and add wsdarr to Sonarr/Radarr as described in the README.
services:
  wsdarr:
    image: ghcr.io/weselinka/wsdarr:latest
    container_name: wsdarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Prague
      WEBSHARE_USERNAME: "muj-ucet"
      WEBSHARE_PASSWORD: "moje-heslo"
      # How Sonarr/Radarr reach wsdarr (container name on the shared network).
      PUBLIC_URL: http://wsdarr:9797
      DOWNLOAD_DIR: /data/downloads/webshare
      # Optional: fixed API key instead of a generated one.
      # WSDARR_API_KEY: "..."
      # Optional: Czech titles from TMDB (free API key at themoviedb.org).
      # TMDB_API_KEY: "..."
      # Titles for searching + instant import after a download
      # (Settings > General > API Key in Sonarr/Radarr).
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: "..."
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: "..."
    volumes:
      - ./config/wsdarr:/config
      - ./data:/data
    ports:
      - "9797:9797"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment: { PUID: "1000", PGID: "1000", TZ: Europe/Prague }
    volumes:
      - ./config/sonarr:/config
      - ./data:/data
    ports:
      - "8989:8989"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment: { PUID: "1000", PGID: "1000", TZ: Europe/Prague }
    volumes:
      - ./config/radarr:/config
      - ./data:/data
    ports:
      - "7878:7878"
